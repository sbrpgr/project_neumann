  /* ===== 목업 web/index.html 스타일 그대로 ===== */
  :root {

  .top, .wrap, .foot { position: relative; z-index: 1; }

  /* ===== 상단 ===== */
  .top { height: 60px; display: flex; align-items: center; gap: 22px; padding: 0 36px; border-bottom: 3px double var(--line2); background: var(--bg); position: sticky; top: 0; z-index: 20; }

  .top .r { margin-left: auto; display: flex; align-items: center; gap: 14px; }

  .stp.cur { color: var(--ink); background: transparent; border: none; font-weight: 600; }

  .stp.done .n { color: var(--green); background: transparent; }

  /* ===== 공통 ===== */
  .wrap { max-width: 1400px; margin: 0 auto; padding: 36px 36px 96px 36px; }
  .col { max-width: 780px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--line2); border-radius: 4px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 4px; border: 1px solid var(--line2); background: var(--card); font-weight: 600; font-size: 13.5px; transition: all .15s; font-family: var(--head); letter-spacing: .02em; }
  .btn:hover { border-color: var(--ink); }
  .btn.dark { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn.dark:hover { background: #000; }
  .btn.lg { height: 48px; padding: 0 22px; font-size: 15px; }

  .tag { display: inline-flex; align-items: center; gap: 4px; height: auto; padding: 0; border-radius: 0; font-family: var(--head); font-size: 12.5px; font-weight: 600; white-space: nowrap; letter-spacing: .02em; }

  .tag.s5 { background: var(--red); color: #fff; padding: 1px 6px; border-radius: 2px; }
  .tag.s4 { color: var(--red); border: 1px solid var(--red-l); padding: 0 6px; border-radius: 2px; }
  .cite { display: inline-flex; align-items: center; height: 20px; padding: 0 6px; margin: 0 2px; border-radius: 2px; background: transparent; color: var(--ink); border: 1px solid var(--line2); font-family: var(--mono); font-size: 11px; font-weight: 600; cursor: pointer; vertical-align: 2px; transition: all .12s; }
  .cite:hover, .cite.on { background: var(--red); border-color: var(--red); color: #fff; }
  .lref { display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border-radius: 2px; background: transparent; border: 1px solid var(--line2); color: var(--text2); font-family: var(--mono); font-size: 11px; font-weight: 600; cursor: pointer; margin-right: 4px; vertical-align: 2px; }
  .lref:hover { border-color: var(--ink); color: var(--ink); }
  .sec { display: flex; align-items: baseline; gap: 12px; margin: 0 0 14px 0; padding-top: 12px; border-top: 3px double var(--line2); }
  .sec h2 { font-size: 22px; }
  .idx { display: flex; gap: 2px; margin: 18px 0 26px 0; border-top: 1px solid var(--line2); border-bottom: 1px solid var(--line2); padding: 6px 0; }
  .idx a { font-family: var(--head); font-size: 12.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); text-decoration: none; padding: 6px 12px; border-radius: 3px; }
  .idx a.on { color: var(--ink); background: var(--soft); }
  .idx a b { color: var(--red); font-family: var(--serif); font-style: italic; font-weight: 400; text-transform: none; letter-spacing: 0; margin-right: 6px; font-size: 14px; }
  .sec .num { font-family: var(--serif); font-size: 22px; color: var(--red); font-style: italic; }
  .sec .d { color: var(--muted); font-size: 13px; }
  .hr { height: 1px; background: var(--line); margin: 40px 0; }

  /* ===== 1. 입력 ===== */
  .hero { text-align: center; margin: 26px 0 30px 0; }
  .hero .title { font-family: var(--script); font-size: 46px; line-height: 1.18; color: var(--ink); max-width: 760px; margin: 0 auto; text-wrap: balance; }
  .hero .by { font-family: var(--head); font-size: 12.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin-top: 12px; }
  .hero .by b { color: var(--red); font-weight: 600; }
  .hero h1 { font-size: 26px; letter-spacing: -0.01em; margin-top: 22px; font-weight: 600; }
  .hero h1 em { font-style: normal; font-weight: 600; color: var(--red); }
  .hero p { color: var(--text2); font-size: 15.5px; margin: 8px auto 0 auto; max-width: 600px; }
  .hero .rule { width: 56px; height: 3px; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); margin: 18px auto 0 auto; }

  .drop b { color: var(--ink); font-weight: 600; display: block; }
  .file { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--line2); border-radius: 3px; margin-top: 10px; background: var(--card); }
  .file .fic { width: auto; height: auto; border-radius: 0; background: transparent; display: inline-flex; color: var(--ink); }
  .file .fn { font-weight: 600; font-size: 14px; }

  .file .x { margin-left: auto; width: 30px; height: 30px; border: none; background: transparent; color: var(--faint); border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; }

  .prev .bd { display: grid; grid-template-columns: 32px minmax(0, 1fr); padding: 8px 14px 10px 6px; font-size: 14px; max-height: 260px; overflow: auto; }
  .prev .ln, .doclines .ln { font-family: var(--mono); font-size: 11px; color: var(--faint); text-align: right; padding-right: 10px; padding-top: 5px; user-select: none; }
  .prev .ln.f, .doclines .ln.f { color: var(--red); font-weight: 600; }
  .prev .l, .doclines .l { padding: 3px 8px; border-radius: 5px; }
  .prev .l.h, .doclines .l.h { font-weight: 700; margin-top: 6px; }
  .prev .l.flag, .doclines .l.flag { text-decoration: underline; text-decoration-color: var(--red); text-decoration-thickness: 1.5px; text-underline-offset: 4px; text-decoration-skip-ink: none; }
  .doclines .l.hl { background: var(--amber-t); }
  textarea.ta { width: 100%; min-height: 340px; resize: vertical; border: 1px solid var(--line2); border-radius: 10px; padding: 14px 16px; font: inherit; font-size: 14px; line-height: 1.75; color: var(--text); background: #fff; outline: none; }
  textarea.ta:focus { border-color: var(--ink); }
  .opts { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
  .optrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .gets .g b { display: block; font-size: 14.5px; margin-bottom: 3px; }

  .srcline .g { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }

  /* ===== 2. 실행 ===== */
  .tl { position: relative; padding-left: 26px; }
  .tl::before { content: ""; position: absolute; left: 9px; top: 6px; bottom: 6px; width: 1px; background: var(--line2); }
  .tn { position: relative; display: grid; grid-template-columns: 110px minmax(0, 1fr) 60px; gap: 14px; padding: 12px 0; }
  .tn::before { content: ""; position: absolute; left: -22px; top: 17px; width: 11px; height: 11px; border-radius: 50%; background: var(--bg); border: 1.5px solid var(--line2); }
  .tn.run::before { border-color: var(--red); background: var(--red); box-shadow: 0 0 0 4px var(--red-t); animation: pl 1s infinite; }
  .tn.done::before { background: var(--ink); border-color: var(--ink); }
  @keyframes pl { 50% { box-shadow: 0 0 0 7px rgba(192,38,59,.08); } }
  .tn .nm { font-family: var(--mono); font-size: 12.5px; font-weight: 600; letter-spacing: .06em; color: var(--faint); padding-top: 2px; }
  .tn.run .nm, .tn.done .nm { color: var(--ink); }
  .tn .msg { color: var(--muted); font-size: 14px; }
  .tn.done .msg { color: var(--text2); }
  .tn .msg strong { color: var(--ink); font-weight: 600; }
  .tn .tm { font-family: var(--mono); font-size: 12px; color: var(--faint); text-align: right; padding-top: 3px; }
  .log { background: var(--soft); color: var(--ink); border: 1px solid var(--line2); border-radius: 3px; padding: 16px 18px; font-family: var(--mono); font-size: 12.5px; line-height: 1.85; min-height: 240px; max-height: 360px; overflow: auto; margin-top: 18px; }
  .log .t { color: var(--faint); margin-right: 10px; } .log .ok { color: var(--green); } .log .w { color: var(--amber); } .log .k { color: var(--red); }

  .pbar > div { height: 100%; background: var(--red); width: 0; transition: width .4s; }

  /* ===== 3. 리포트 3단 ===== */
  .rep { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 36px; align-items: start; max-width: 1240px; margin: 0 auto; }
  .doc { min-width: 0; }
  .doc section { scroll-margin-top: 76px; margin-bottom: 44px; }
  .panel { position: sticky; top: 76px; height: calc(100vh - 96px); display: flex; flex-direction: column; }
  .ptabs { display: flex; gap: 18px; padding: 0; background: transparent; border-bottom: 1px solid var(--line2); margin-bottom: 14px; }
  .ptabs button { flex: 0 0 auto; height: 32px; border: none; border-bottom: 2px solid transparent; margin-bottom: -1px; border-radius: 0; background: transparent; color: var(--muted); font-weight: 600; font-size: 12.5px; font-family: var(--head); letter-spacing: .04em; padding: 0 2px; }
  .ptabs button.on { background: transparent; color: var(--ink); box-shadow: none; border-bottom-color: var(--red); }
  .pbody { flex: 1; overflow: auto; padding: 18px 18px 24px 18px; font-size: 14px; }
  .pq { font-family: var(--serif); font-size: 19px; line-height: 1.5; color: var(--ink); padding: 0; } .pq::before { content: "\201C"; color: var(--red); margin-right: 2px; } .pq::after { content: "\201D"; color: var(--red); margin-left: 2px; }
  .pq.ko { font-family: var(--sans); font-size: 15px; }
  .pkv { display: grid; grid-template-columns: 66px minmax(0, 1fr); gap: 0 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; align-items: baseline; }

  .empty { color: var(--muted); font-size: 13px; padding: 30px 6px; text-align: center; }
  .doclines { display: grid; grid-template-columns: 30px minmax(0, 1fr); font-size: 13.5px; }

  /* 스트립 + 요약 */
  .strip { display: grid; grid-template-columns: repeat(15, minmax(0, 1fr)); gap: 4px; }
  .strip .c { height: 36px; border-radius: 2px; background: var(--card); border: 1px solid var(--line2); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; line-height: 1; font-family: var(--mono); font-size: 12px; color: var(--faint); transition: all .12s; }
  .strip .c.f { background: var(--red-t); border-color: var(--red-l); color: var(--red-d); }
  .strip .c.f.hot { background: var(--red); border-color: var(--red); color: #fff; }
  .strip .c:hover { border-color: var(--ink); }
  .kpiline { display: flex; gap: 28px; flex-wrap: wrap; padding: 18px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 18px 0 22px 0; }
  .kpiline .k .v { font-family: var(--serif); font-size: 30px; line-height: 1; color: var(--ink); }
  .kpiline .k .v i { color: var(--red); font-family: var(--sans); font-style: normal; font-weight: 600; font-size: 15px; margin-left: 2px; }
  .kpiline .k .l { font-size: 13px; color: var(--muted); margin-top: 5px; }
  .top3 { display: flex; flex-direction: column; gap: 10px; }
  .t3 { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 18px; cursor: pointer; transition: all .15s; }
  .t3:hover { border-color: var(--ink); }
  .t3 .rk { font-family: var(--serif); font-style: italic; font-size: 30px; color: var(--red); line-height: 1; }
  .t3 h3 { font-size: 16px; }
  .t3 .f { font-size: 13.5px; color: var(--muted); margin-top: 2px; }

      '<div><div class="k">Version</div>파이프라인 ' + esc(st.pipeline_version || '—') + '<br>API ' + esc(H ? H.version : '—') + '</div></div>' +
      '<div class="sm muted" style="margin-top:14px; padding-top:12px; border-top:1px solid var(--line);">모든 출력은 \'문서화된 위험 신호\'이며 특정 저자·리뷰어에 대한 판단이 아닙니다. 리뷰어는 익명 번호로만 표기됩니다. 최종 판단은 연구자에게 있습니다.</div></div></section>';
    var panel = '<aside class="panel card" style="padding:12px;"><div class="ptabs"><button class="' + (S.ptab === 'ev' ? 'on' : '') + '" data-ptab="ev" type="button">근거</button><button class="' + (S.ptab === 'plan' ? 'on' : '') + '" data-ptab="plan" type="button">계획서</button></div><div class="pbody" id="pbody"></div></aside>';
    var planApp = '<section id="s-plan" class="print-only"><div class="sec"><span class="num">§</span><h2>부록 · 계획서 원문</h2><span class="d">' + esc(D.plan.file) + ' · 붉은 밑줄 = 위험카드가 대응하는 문장</span></div><div class="card" style="padding:16px 18px;">' + docLines(null) + '</div></section>';
    return '<div class="rep"><article class="doc">' + summary + map + cardsSec + review + check + trace + planApp + '</article>' + panel + '</div>';
  }
  function renderPanel() {
    var b = $('pbody'); if (!b) return;
    if (S.ptab === 'plan') {
      var n = S.line, hits = n ? D.cards.filter(function (c) { return c.lines.indexOf(n) >= 0; }) : [];
      b.innerHTML = '<div class="eyebrow" style="margin-bottom:8px;">계획서 원문 · ' + esc(D.plan.file) + '</div>' + (D.plan.lines.length ? docLines(n) : '<div class="empty">계획서 줄 없음</div>') + (hits.length ? '<div style="margin-top:16px;"><div class="eyebrow" style="margin-bottom:4px;">' + n + '행이 부르는 지적</div>' + hits.map(function (c) { var f = fam(c.fam); return '<div class="pkv"><div class="k">' + esc(f.k) + '</div><div>' + esc(f.n) + ' · 근거 ' + c.ev.map(cite).join('') + '</div></div>'; }).join('') + '</div>' : '<div class="sm muted" style="margin-top:12px;">행 번호나 스트립을 누르면 원문 줄로 이동</div>');
    } else {
      var k = S.ev, e = k && D.ev[k];
      if (!e) { b.innerHTML = '<div class="empty">본문의 <span class="cite" style="cursor:default;">#n</span> 번호나 인용문을 누르면<br>실제 심사평 원문이 여기에 표시됩니다.</div>'; return; }
      var f = fam(e.fam), same = D.works.filter(function (w) { return w.f && w.f[e.fam]; }), l = e.ln ? lineOf(e.ln) : null, u = safeUrl(e.u);
      b.innerHTML = '<div style="display:flex; align-items:center; gap:8px; margin-bottom:12px;"><span class="cite on" style="cursor:default;">#' + esc(k) + '</span><strong style="font-size:13px;">' + esc(f.k) + ' · ' + esc(f.n) + '</strong></div><div class="pq' + (HANGUL.test(e.q) ? ' ko' : '') + '">' + esc(e.q) + '</div>' +
        '<div style="margin-top:16px;"><div class="pkv"><div class="k">논문</div><div>' + esc(e.p) + '</div></div><div class="pkv"><div class="k">출처</div><div>' + esc(e.v || '—') + '<br>' + (e.x ? '<span class="tag x">확장 검색 · 유사 ' + D.works.length + '편 외</span>' : '<span class="tag gray">유사 ' + D.works.length + '편 내' + (e.map ? ' · ' + e.map + '번' : '') + '</span>') + '</div></div><div class="pkv"><div class="k">결정</div><div>' + dec(e.d) + '</div></div>' + (e.rt ? '<div class="pkv"><div class="k">평점</div><div>' + esc(e.rt) + ' / 10' + (e.rv ? ' · <span class="mono">' + esc(e.rv) + '</span>' : '') + ' · 익명 유지</div></div>' : '') +
        '<div class="pkv"><div class="k">원문</div><div>' + (u ? '<a href="' + esc(u) + '" target="_blank" rel="noopener noreferrer" class="mono" style="display:inline-flex; gap:4px; align-items:center;">' + esc(u.replace(/^https?:\/\//, '')) + EXT + '</a>' : '<span class="muted">링크 없음</span>') + '</div></div>' +
        (e.off ? '<div class="pkv"><div class="k">오프셋</div><div class="mono">' + esc(e.off[0]) + '–' + esc(e.off[1]) + (e.sha ? ' · ' + esc(e.sha) : '') + '</div></div>' : '') + '</div>' +
        (l ? '<div style="margin-top:16px;"><div class="eyebrow" style="margin-bottom:6px;">계획서의 대응 문장</div><div style="padding:10px 12px; background:var(--soft); border-radius:3px; font-size:13.5px;">' + lref(e.ln) + esc(l.t) + '</div></div>' : '') +
        (D.works.length ? '<div style="margin-top:16px;"><div class="eyebrow" style="margin-bottom:4px;">같은 위험 · 유사 ' + D.works.length + '편 중 ' + same.length + '편</div>' + same.map(function (w) { return '<div class="same"><div>' + esc(w.s) + '</div><div>' + dec(w.d) + '</div><div class="mono" style="text-align:right;">' + esc(w.r) + '</div></div>'; }).join('') + '</div>' : '');
    }
  }
  function spy() {
    var secs = Array.prototype.slice.call(document.querySelectorAll('.doc section')), links = document.querySelectorAll('.idx a'); if (!secs.length || !window.IntersectionObserver) return;
    var io = new IntersectionObserver(function (es) { es.forEach(function (en) { if (en.isIntersecting) { links.forEach(function (a) { a.classList.toggle('on', a.dataset.jump === en.target.id); }); } }); }, { rootMargin: '-20% 0px -70% 0px' });
    secs.forEach(function (s) { io.observe(s); });
  }
  var order = ['채택', '보류', '기각'];

  /* ---------- 라우터 ---------- */
  function render() {
    var app = $('app');
    document.body.dataset.ready = '0';
    if (S.step === 0) {
      document.body.dataset.view = 'input';
      app.innerHTML = renderInput();
      $('btnStart').addEventListener('click', function () { var ta = $('ta'); if (ta) S.text = ta.value; if (!S.text.trim()) return; S.job = { state: 'running' }; go(1); startAnalysis(); });
      var ta = $('ta'); if (ta) ta.addEventListener('input', function () { S.text = ta.value; $('cnt').textContent = ta.value.length + ' chars'; $('btnStart').disabled = !ta.value.trim(); });
      var dz = $('drop'), fi = $('fileIn');
      if (dz && fi) {
        dz.addEventListener('click', function () { fi.click(); });
        dz.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); fi.click(); } });
        dz.addEventListener('dragover', function (ev) { ev.preventDefault(); });
        dz.addEventListener('drop', function (ev) { ev.preventDefault(); readFile(ev.dataTransfer && ev.dataTransfer.files[0]); });
        fi.addEventListener('change', function () { readFile(fi.files[0]); });
      }
      var fx = $('fileX'); if (fx) fx.addEventListener('click', function () { S.text = ''; S.filename = ''; S.fileMeta = ''; render(); });
    } else if (S.step === 1) {
      document.body.dataset.view = 'job';
      app.innerHTML = renderJob();
      var rt = $('btnRetry'); if (rt) rt.addEventListener('click', startAnalysis);
    } else if (S.step === 2 && D) {
      document.body.dataset.view = 'report';
      app.innerHTML = renderReport(); renderPanel(); spy();
      $('btnNew').addEventListener('click', newAnalysis);
    }
    document.body.dataset.ready = '1';
  }
  function newAnalysis() { closeAll(); D = null; S.text = ''; S.filename = ''; S.fileMeta = ''; S.inErr = ''; S.job = null; S.ev = null; S.line = null; S.ptab = 'plan'; S.maxStep = 0; go(0); }
  function openPanel() { document.body.classList.add('popen'); }
  function closeAll() { document.body.classList.remove('popen'); }
  document.addEventListener('click', function (ev) {
    var t;
    if ((t = ev.target.closest('[data-ev]'))) { S.ev = t.dataset.ev; S.ptab = 'ev'; document.querySelectorAll('.cite').forEach(function (c) { c.classList.toggle('on', c.dataset.ev === S.ev); }); document.querySelectorAll('.ptabs button').forEach(function (b) { b.classList.toggle('on', b.dataset.ptab === 'ev'); }); renderPanel(); openPanel(); return; }
    if ((t = ev.target.closest('[data-line]'))) { S.line = +t.dataset.line; S.ptab = 'plan'; document.querySelectorAll('.ptabs button').forEach(function (b) { b.classList.toggle('on', b.dataset.ptab === 'plan'); }); renderPanel(); openPanel(); return; }
    if ((t = ev.target.closest('[data-ptab]'))) { S.ptab = t.dataset.ptab; document.querySelectorAll('.ptabs button').forEach(function (b) { b.classList.toggle('on', b === t); }); renderPanel(); return; }
    if ((t = ev.target.closest('[data-jump]'))) { ev.preventDefault(); var el = $(t.dataset.jump); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    if ((t = ev.target.closest('[data-step]')) && !t.disabled) { closeAll(); var s = +t.dataset.step; if (s === 2 && !D) return; go(s); return; }
    if ((t = ev.target.closest('[data-mode]'))) { var ta = $('ta'); if (ta) S.text = ta.value; S.mode = t.dataset.mode; S.inErr = ''; render(); return; }
    if ((t = ev.target.closest('.dec'))) { var it = D.checklist[+t.dataset.i]; it.s = order[(order.indexOf(it.s) + 1) % 3]; t.dataset.s = it.s; t.textContent = it.s; var c = ckCounts(), sum = $('ckSum'); if (sum) sum.innerHTML = '채택 <strong>' + c['채택'] + '</strong> · 보류 <strong>' + c['보류'] + '</strong> · 기각 <strong>' + c['기각'] + '</strong>'; return; }
  });
  $('scrim').addEventListener('click', closeAll);
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') closeAll(); });
  renderSteps(); render(); loadHealth();
})();
</script>
